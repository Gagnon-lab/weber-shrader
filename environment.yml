name: tm
channels:
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
  - conda-forge
dependencies:
  - importnb
  - ipympl=0.9.7
  - joblib
  - jupyter
  - matplotlib
  - mpmath
  - natsort
  - nbformat
  - numpy
  - openpyxl
