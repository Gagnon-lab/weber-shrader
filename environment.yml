  - python=3.11
  - scipy
  - seaborn
  - tqdm
  - levenshtein
  - scikit-learn
  - jupyter_contrib_nbextensions
  - nodejs
  - networkx
  - statsmodels
prefix: /opt/anaconda3/envs/tm
