# Standard secondary barcode-cleaning pipeline.
name: full_pipeline
overwrite: true
compress: true
data_dir: gestalt_output
dataset: mp0.8_tq10
total_read_cutoff: 1000
used_prop_cutoff: 0.3
reads_cutoff: 10
prop_cutoff: 0.005
unedited: NONE_NONE_NONE_NONE_NONE_NONE_NONE_NONE_NONE_NONE
cluster_barcodes: true
edge_distance: 1
run_fish_triple_rep_filter: true
run_fish_one_sample_filter: true
ratio_cutoff: 50
list_questionable_barcodes_before_classify: true
list_questionable_barcodes_after_classify: true
image_questionable_barcodes_before_classify: true
image_questionable_barcodes_after_classify: true
manual_classification: {}
delete_still_questionable_barcodes: true
detect_anomalies: true
final_kept_read_cutoff_rep: 0.3
final_kept_read_cutoff_fish: 0.5
edited_fish_only: false
fillna: false
plot_all_mullers: true
plot_all_heatmaps: true
output_step_summaries: true
